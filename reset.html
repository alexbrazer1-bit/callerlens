<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CallerLens password reset</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #081428; color: #f4f7fb; font-family: sans-serif; }
      main { width: min(420px, calc(100% - 32px)); }
      h1 { font-size: 28px; margin: 0 0 8px; }
      p { color: #b7c5d6; line-height: 1.4; }
      input, button { width: 100%; box-sizing: border-box; border: 0; border-radius: 14px; font-size: 16px; }
      input { margin: 8px 0; padding: 14px 16px; }
      button { margin-top: 8px; padding: 14px 16px; background: #1fa855; color: #081428; font-weight: 700; }
      .note { min-height: 1.4em; }
    </style>
  </head>
  <body>
    <main>
      <h1>New password</h1>
      <p id="lead">Choose a new password for CallerLens. You can then sign in on any phone.</p>
      <form id="form">
        <input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="New password" required />
        <button type="submit">Save password</button>
      </form>
      <p class="note" id="note"></p>
    </main>
    <script>
      const key = "sb_publishable_J2Y8_OeRiZUTdaSezJpO-w_-ayHZZMn";
      const base = "https://zdrfwxodiezyrxcqovab.supabase.co";
      const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
      const access = hash.get("access_token");
      const lead = document.getElementById("lead");
      const note = document.getElementById("note");
      const form = document.getElementById("form");
      if (!access || hash.get("type") !== "recovery") {
        lead.textContent = "Open the reset email again, or go back to CallerLens and paste the email link under Forgot password. Do not use callerlens.app.";
        form.hidden = true;
      }
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = document.getElementById("password").value;
        note.textContent = "Saving…";
        try {
          const response = await fetch(base + "/auth/v1/user", {
            method: "PUT",
            headers: { apikey: key, Authorization: "Bearer " + access, "Content-Type": "application/json" },
            body: JSON.stringify({ password })
          });
          const body = await response.json().catch(() => ({}));
          if (!response.ok) {
            note.textContent = body.msg || body.error_description || body.message || "The new password was not saved. Request a new email in the app.";
            return;
          }
          lead.textContent = "Password updated. Go back to CallerLens and sign in.";
          form.hidden = true;
          note.textContent = "";
        } catch (error) {
          note.textContent = "No connection. Check the signal and try again.";
        }
      });
    </script>
  </body>
</html>
